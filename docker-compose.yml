# ERPNext v15 + Receipt Capture + a local LLM, modelled on frappe_docker's pwd.yml.
#
#   cp .env.example .env      # set passwords
#   docker compose up -d --build
#   open http://localhost:8080  (Administrator / $ADMIN_PASSWORD)
#
# First start takes a few minutes: site creation, ERPNext install and the model download.

x-app-image: &app_image
  image: receipt-capture-erpnext:${APP_VERSION:-latest}
  build: .

x-backend: &backend
  <<: *app_image
  depends_on:
    configurator:
      condition: service_completed_successfully
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  restart: unless-stopped

services:
  configurator:
    <<: *app_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy

  create-site:
    <<: *backend
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        wait-for-it -t 120 db:3306
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        if [ ! -d "sites/$$SITE_NAME" ]; then
          bench new-site "$$SITE_NAME" \
            --mariadb-user-host-login-scope='%' \
            --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" \
            --admin-password="$$ADMIN_PASSWORD" \
            --install-app erpnext --install-app receipt_capture \
            --set-default
        else
          bench --site "$$SITE_NAME" migrate
        fi
        bench --site "$$SITE_NAME" execute receipt_capture.install.configure_ollama \
          --kwargs "{'url': 'http://ollama:11434', 'model': '$$OLLAMA_MODEL'}"
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      configurator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    <<: *backend

  # Runs OCR + LLM extraction jobs (queued on "long")
  queue-long:
    <<: *backend
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend
    command: bench schedule

  websocket:
    <<: *backend
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js

  frontend:
    <<: *app_image
    command: nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 25m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket
    restart: unless-stopped

  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped

  # Local LLM. alpine/ollama is a ~40 MB CPU-only build; on a GPU host use
  # ollama/ollama and add a GPU device reservation.
  ollama:
    image: ${OLLAMA_IMAGE:-alpine/ollama:latest}
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ${OLLAMA_IMAGE:-alpine/ollama:latest}
    entrypoint: ["sh", "-c"]
    command: ["OLLAMA_HOST=ollama:11434 ollama pull $$OLLAMA_MODEL"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      - ollama
    restart: "no"

volumes:
  sites:
  db-data:
  redis-queue-data:
  ollama-models:
