name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests on ERPNext v15 (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_ROOT_PASSWORD: ci-root-password
      ADMIN_PASSWORD: ci-admin-password
      SITE_NAME: erp.localhost
      APP_VERSION: ci
    steps:
      - uses: actions/checkout@v4

      # Same image and compose stack as production; Ollama isn't needed because
      # the tests replace OCR and the model with fixed results where required.
      - name: Build image and create site (ERPNext + receipt_capture)
        run: |
          docker compose build
          docker compose up -d create-site backend
          docker compose wait create-site

      - name: Run tests
        run: |
          docker compose exec -T backend bench --site "$SITE_NAME" set-config allow_tests true
          docker compose exec -T backend bench --site "$SITE_NAME" run-tests --app receipt_capture

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200 create-site backend db

  e2e:
    name: Selenium UI tests (Python, JavaScript, C#)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_ROOT_PASSWORD: ci-root-password
      ADMIN_PASSWORD: ci-admin-password
      SITE_NAME: erp.localhost
      APP_VERSION: ci
      # The suites use the runner's Chrome and open the site by its name (see README)
      BASE_URL: http://erp.localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack (ERPNext, workers, websocket, Ollama + model)
        run: |
          docker compose up -d --build
          docker compose wait create-site ollama-pull

      - name: Seed the site (company, expense item, tax account, test users)
        run: docker compose exec -T backend bench --site "$SITE_NAME" execute receipt_capture.e2e_setup.setup_site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Triage self-test
        run: python -m unittest discover -s e2e/triage

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/js/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Each suite runs even if an earlier one failed, so every result is reported
      - name: Python suite (pytest + Selenium)
        run: e2e/run-suite.sh python

      - name: JavaScript suite (Mocha + selenium-webdriver)
        if: success() || failure()
        run: e2e/run-suite.sh js

      - name: C# suite (NUnit + Selenium WebDriver)
        if: success() || failure()
        run: e2e/run-suite.sh dotnet

      - name: AI triage of failures (local model, advisory)
        if: failure()
        run: |
          docker compose logs --no-color --tail 300 backend queue-long websocket frontend > compose.log 2>&1 || true
          python e2e/triage/triage.py --results 'e2e/**/junit.xml' --artifacts e2e --logs compose.log --out triage

      - name: Upload screenshots, test reports and triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            triage.md
            triage.json
            e2e/**/artifacts/
            e2e/dotnet/ReceiptCapture.E2E/TestResults/
            e2e/dotnet/ReceiptCapture.E2E/bin/**/artifacts/
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200 create-site backend db

  e2e:
    name: Selenium UI tests (Python, JavaScript, C#)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_ROOT_PASSWORD: ci-root-password
      ADMIN_PASSWORD: ci-admin-password
      SITE_NAME: erp.localhost
      APP_VERSION: ci
      # The suites use the runner's Chrome and open the site by its name (see README)
      BASE_URL: http://erp.localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Start the full stack (ERPNext, workers, websocket, Ollama + model)
        run: |
          docker compose up -d --build
          docker compose wait create-site ollama-pull

      - name: Seed the site (company, expense item, tax account, test users)
        run: docker compose exec -T backend bench --site "$SITE_NAME" execute receipt_capture.e2e_setup.setup_site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/js/package-lock.json

      - name: JavaScript suite (Mocha + selenium-webdriver)
        working-directory: e2e/js
        run: |
          npm ci
          npx mocha --reporter mocha-junit-reporter --reporter-options mochaFile=artifacts/junit.xml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: C# suite (NUnit + Selenium WebDriver)
        working-directory: e2e/dotnet/ReceiptCapture.E2E
        run: dotnet test --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/js/artifacts/
            e2e/dotnet/ReceiptCapture.E2E/TestResults/
            e2e/dotnet/ReceiptCapture.E2E/bin/**/artifacts/
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend queue-long websocket frontend
